{% extends "base.html" %}
{% block title %}Log in · TaskMate{% endblock %}
{% block content %}
<div class="auth-card mx-auto">
    <div class="text-center mb-4">
        <div class="brand-icon">✓</div>
        <h1 class="h3 fw-bold mt-3">Welcome back</h1>
        <p class="text-muted">Log in to continue your progress.</p>
    </div>
    <form method="post">
        {% csrf_token %}
        {% if form.non_field_errors %}<div class="alert alert-danger">{{ form.non_field_errors }}</div>{% endif %}
        <div class="mb-3"><label class="form-label">Username</label><input class="form-control" type="text" name="username" autocomplete="username" required></div>
        <div class="mb-3"><label class="form-label">Password</label><input class="form-control" type="password" name="password" autocomplete="current-password" required></div>
        <input type="hidden" name="next" value="{{ next }}">
        <button class="btn btn-primary w-100 mt-2" type="submit">Log in</button>
    </form>
    <p class="text-center mt-4 mb-0 text-muted">New here? <a href="{% url 'register' %}">Create an account</a></p>
</div>
{% endblock %}
